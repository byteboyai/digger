<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:" />
<title>editor host (milkdown)</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfaf7; color: #1d1d1b; }
  #editor { box-sizing: border-box; height: 100%; overflow: auto; padding: 24px 40px; font: 17px/1.8 -apple-system, "PingFang SC", sans-serif; }
  .ProseMirror { outline: none; min-height: 100%; max-width: 720px; margin: 0 auto; white-space: pre-wrap; word-wrap: break-word; }
  .ProseMirror p { margin: 0 0 .8em; }
  .ProseMirror h1, .ProseMirror h2 { margin: 1em 0 .5em; line-height: 1.3; }
</style>
</head>
<body>
<div id="conflict" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#fff3cd;border-top:1px solid #e0c36a;padding:10px 16px;font:14px -apple-system,'PingFang SC',sans-serif;z-index:10">
  <span id="conflict-text"></span>
  <button id="conflict-mine">保留我的</button>
  <button id="conflict-official">采用正式版本</button>
</div>
<div id="editor"></div>
<script type="module" src="/src/entry-milkdown.ts"></script>
</body>
</html>
