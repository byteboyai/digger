[package]
name = "digger-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Digger 的 MCP 二进制:digger-paths 的产品身份 + dozer-mcp 的 run_main,只开记忆工具。"

[[bin]]
name = "digger-mcp"
path = "src/main.rs"

[dependencies]
digger-paths = { path = "../paths" }
dozer-mcp.workspace = true

[dev-dependencies]
dozer-client.workspace = true
dozer-core.workspace = true
dozerd.workspace = true
digger-store = { path = "../store" }
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
