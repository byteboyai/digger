[package]
name = "digger-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Digger 领域持久化:任务完成用量的幂等落盘账本与 `dozer_services::UsageService` 实现。纯业务层,不得依赖任何 bytehost-* 宿主 crate;面板/宿主接线由 digger-desktop 注入。"

[dependencies]
# 领域类型(纯 serde)与服务 trait 接缝(无 bytehost),业务层可安全依赖。
dozer-model.workspace = true
dozer-services.workspace = true
# Project 注册表与共享记忆的存储与进程内服务(Dozer 与 Digger 共用)。
dozer-store-project.workspace = true
# S6a:迁移旧 projects.db 到 digger.db,以及设置 WAL 模式。版本必须与 Dozer 一致。
rusqlite.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
