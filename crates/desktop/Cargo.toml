[package]
name = "digger-desktop"
version = "0.1.7"
edition.workspace = true
license.workspace = true
description = "Digger 桌面组合根:在共享 bytehost 宿主上启动 Digger 产品壳"
publish = false

[[bin]]
name = "digger"
path = "src/main.rs"

# 无窗口 icon-scale 布局探针:由 scale 用例 fork,不初始化测试 harness / daemon。
[[bin]]
name = "icon_scale_widget_probe"
path = "src/bin/icon_scale_widget_probe.rs"

[dependencies]
bytehost-core.workspace = true
# 共享窗口骨架:顶栏 / 图标栏 / 面板区 / 分隔线 / 放大态 / 布局持久化。
bytehost-chrome.workspace = true
bytehost-desktop.workspace = true
# 应用 webview 的纯安全策略:存储标识与数据存储清除排队(StoreRemovals)。
bytehost-webview.workspace = true
# 应用服务类型 + 进程内嵌入后端(desktop 是宿主适配层白名单,可直接依赖 bytehost-*)。
bytehost-apps = { workspace = true, features = ["server"] }
bytehost-client = { workspace = true, features = ["in-process"] }
bytehost-panel.workspace = true
# 共享设置状态 / 视图(产品中立;本 crate 是唯一的 Digger 适配层)。
bytehost-settings.workspace = true
bytehost-settings-ui.workspace = true
bytehost-git-accounts.workspace = true
# Digger 的宿主适配层:执行器 / 请求身份 / 服务生命周期 / 产品信任策略。
digger-app-host = { path = "../app-host" }
# Digger 产品身份与数据根(S6a):config_dir / state_dir / product() 等统一由 digger-paths 提供。
digger-paths = { path = "../paths" }
dozer-core.workspace = true
# Digger 领域持久化:任务完成用量账本 + `UsageService` 实现(Task 20)。
digger-store = { path = "../store" }
# Markdown 编辑器的 Rust 一侧(纯库;本 crate 只做 webview / 几何 / iced 栏的宿主适配)。
digger-editor = { path = "../editor" }

# 同源 Usage 面板库与领域类型/服务接缝(Dozer/Digger 共用,Task 19/20)。
dozer-model.workspace = true
dozer-services.workspace = true
dozer-panel-usage.workspace = true
# 同源 Todo 面板库(S3b-1):待办列表 + 分类树 + web 资源。
dozer-panel-todo.workspace = true
dozer-panel-conversations.workspace = true
dozer-panel-browser.workspace = true
dozer-panel-group-chat.workspace = true
# 同源 Project 面板库(S5a):与其适配层一起接入「项目」面板。
dozer-panel-project.workspace = true
dozer-panel-files.workspace = true
# 同源预览面板库(S5b-2 P3):适配层 `adapters/preview_native.rs` 唯一消费者。
dozer-panel-preview.workspace = true
dozer-preview-core.workspace = true
dozer-panel-host.workspace = true
dozer-panel-term.workspace = true
# S6d-2:Agent 面板库(每项目会话状态、恢复、页签/列表/终端视图、选择器与确认框)。
dozer-panel-agent.workspace = true
# S6a:守护进程客户端(协议握手 + 连接检查)。
dozer-client.workspace = true
# S6e:MCP 安装路径推导(与 digger-mcp 同一份库函数)。
dozer-mcp.workspace = true
bytegit.workspace = true
dozer-git-runtime.workspace = true

byteui.workspace = true

iced.workspace = true
iced_core.workspace = true
# 共享面板库的 `PanelDisplay` 接缝用 iced 的 widget/renderer 具名类型;与 iced 同版本。
iced_widget = { version = "0.14", default-features = false }
# 渲染后端:iced_renderer 在 release 下必须启用 wgpu/tiny-skia 之一,否则 `compile_error!`。
# 经 `iced` facade 的 `wgpu` feature 启用(与 Dozer 同栈,见 workspace 依赖)。
# `tiny-skia` 是无窗口布局探针(`scale_widget_checks` / `icon_scale_widget_probe`)
# 的软件渲染器:不需要 GPU 或图形会话。
iced_renderer = { version = "0.14", default-features = false, features = ["tiny-skia"] }
iced_tiny_skia = { version = "0.14", default-features = false }
iced_wgpu = { version = "0.14", default-features = false }
wry.workspace = true
objc2-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
directories.workspace = true
rfd = "0.15"
libc = "0.2"

[build-dependencies]
dozer-panel-usage.workspace = true
dozer-panel-todo.workspace = true

[dev-dependencies]
# Pixel regression checks for panel corner masks (same backend as iced_tiny_skia).
tiny-skia = "0.11.4"
# Headless widget layout/operation tests without a window or GPU.
tempfile = "3"
# 集成测试在进程内拉起真实 diggerd(S3b-1 Task 6)。
dozerd.workspace = true
rusqlite.workspace = true
# MCP 工具调用在集成测试里直接走 rmcp 的 Parameters 包装。
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
dozer-mcp.workspace = true
# 测试里用运行时同款的 `task::into_stream` 数一个 Task 发出的窗口动作(`iced::runtime` 不对外公开)。
iced_runtime = "0.14"
