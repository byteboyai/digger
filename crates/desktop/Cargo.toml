[package]
name = "digger-desktop"
version = "0.1.2"
edition.workspace = true
license.workspace = true
description = "Digger 桌面组合根:在共享 bytehost 宿主上启动 Digger 产品壳"
publish = false

[[bin]]
name = "digger"
path = "src/main.rs"

[dependencies]
bytehost-core.workspace = true
# 共享窗口骨架:顶栏 / 图标栏 / 面板区 / 分隔线 / 放大态 / 布局持久化。
bytehost-chrome.workspace = true
bytehost-desktop.workspace = true
# 应用 webview 的纯安全策略:存储标识与数据存储清除排队(StoreRemovals)。
bytehost-webview.workspace = true
# 应用服务类型 + 进程内嵌入后端(desktop 是宿主适配层白名单,可直接依赖 bytehost-*)。
bytehost-apps = { workspace = true, features = ["server"] }
bytehost-client = { workspace = true, features = ["in-process"] }
bytehost-panel.workspace = true
# Digger 的宿主适配层:执行器 / 请求身份 / 服务生命周期 / 产品信任策略。
digger-app-host = { path = "../app-host" }
# Digger 领域持久化:任务完成用量账本 + `UsageService` 实现(Task 20)。
digger-store = { path = "../store" }
# Markdown 编辑器的 Rust 一侧(纯库;本 crate 只做 webview / 几何 / iced 栏的宿主适配)。
digger-editor = { path = "../editor" }

# 同源 Usage 面板库与领域类型/服务接缝(Dozer/Digger 共用,Task 19/20)。
dozer-model.workspace = true
dozer-services.workspace = true
dozer-panel-usage.workspace = true
# 同源 Project 面板库(S5a):与其适配层一起接入「项目」面板。
dozer-panel-project.workspace = true
dozer-panel-files.workspace = true
# 同源预览面板库(S5b-2 P3):适配层 `adapters/preview_native.rs` 唯一消费者。
dozer-panel-preview.workspace = true
dozer-preview-core.workspace = true
dozer-panel-host.workspace = true
bytegit.workspace = true

byteui.workspace = true

iced.workspace = true
iced_core.workspace = true
# 共享面板库的 `PanelDisplay` 接缝用 iced 的 widget/renderer 具名类型;与 iced 同版本。
iced_widget = { version = "0.14", default-features = false }
# 渲染后端:iced_renderer 在 release 下必须启用 wgpu/tiny-skia 之一,否则 `compile_error!`。
# 经 `iced` facade 的 `wgpu` feature 启用(与 Dozer 同栈,见 workspace 依赖)。
iced_renderer = { version = "0.14", default-features = false }
wry.workspace = true
objc2-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
directories.workspace = true
rfd = "0.15"

[build-dependencies]
dozer-panel-usage.workspace = true

[dev-dependencies]
tempfile = "3"
