[workspace]
resolver = "3"
members = ["crates/*"]
# spike/* 是一次性技术验证(ADR 验证项),各自带 [workspace]/[package] 且随时可删,
# 不进正式 workspace 的锁文件。嵌套的 spike/parser-agreement/rust 同样排除。
exclude = [
    "spike/block-identity",
    "spike/editor-host",
    "spike/md-engine",
    "spike/md-mirror",
    "spike/parser-agreement",
    "spike/text-merge",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
directories = "6"
# Markdown 块解析与块 ID 对齐(digger-editor)。
pulldown-cmark = { version = "0.13", default-features = false }
similar = "2"

# 共享桌面宿主契约:窗口壳、面板、Surface、布局、焦点(bytehost-desktop)。
bytehost-core = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }
# 共享窗口骨架(S1)。开发期靠文件末尾的 [patch] 指向本地 worktree;打 tag 后改成新 tag 并删掉 [patch]。
bytehost-chrome = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }
bytehost-desktop = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }
# 应用 webview 的纯安全策略(origin/nonce/存储标识/数据存储清除排队);桌面宿主唯一真相。
bytehost-webview = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }

# 应用宿主平台:注册表/生命周期、与传输无关的客户端 API、与界面框架无关的面板状态机。
bytehost-apps = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }
bytehost-client = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }
bytehost-panel = { git = "https://github.com/byteboyai/bytehost", tag = "v0.2.0" }

# 组件库(Dozer 与 Digger 共用);iced 版本必须与 byteui 一致,一起升。
byteui = { git = "https://github.com/byteboyai/byteui", tag = "v0.4.1" }

# Dozer 与 Digger 共用的 Usage 面板库 + 领域类型/服务接缝(Task 19/20)。
# 领域 `dozer-model`(纯 serde)与 `dozer-services`(trait 接缝)供业务层 `digger-store`
# 实现 `UsageService`;`dozer-panel-usage` 含公共 UI 与 bytehost Surface,只许宿主适配层
# (`digger-desktop`)依赖。Task 22:dozer main 已推远端(含 `dozer-panel-usage`),
# 固定到该 revision(dozer 无对应发布 tag,用 rev 钉死)。
dozer-model = { git = "https://github.com/byteboyai/dozer", rev = "67ab0e657d75135b882ace2f3aa7a56617776c60" }
dozer-services = { git = "https://github.com/byteboyai/dozer", rev = "67ab0e657d75135b882ace2f3aa7a56617776c60" }
dozer-panel-usage = { git = "https://github.com/byteboyai/dozer", rev = "67ab0e657d75135b882ace2f3aa7a56617776c60" }

iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu"] }
# iced 的 core 类型(如 `text::Shaping`);iced 0.14 未公开重导出,组合根按需直接依赖同一版本。
iced_core = { version = "0.14", default-features = false }
wry = "0.55.1"
# 取 macOS 主版本号判数据存储清除是否受支持(纯策略 crate 不碰 objc2,宿主层来问)。
objc2-foundation = "0.3"

# ---- 开发期临时配置(S1 最后一个任务移除)----
# 把 bytehost 与 byteui 的 git 来源指向本地 worktree,使依赖图里只有一份 bytehost-core / byteui:
# 两份会让 `PanelId` 类型不兼容,也会让 byteui 的全局主题状态分裂(用量面板的主题会错)。
[patch."https://github.com/byteboyai/bytehost"]
bytehost-core = { path = "../bytehost-chrome/crates/bytehost-core" }
bytehost-chrome = { path = "../bytehost-chrome/crates/bytehost-chrome" }
bytehost-desktop = { path = "../bytehost-chrome/crates/bytehost-desktop" }
bytehost-webview = { path = "../bytehost-chrome/crates/bytehost-webview" }
bytehost-apps = { path = "../bytehost-chrome/crates/bytehost-apps" }
bytehost-client = { path = "../bytehost-chrome/crates/bytehost-client" }
bytehost-panel = { path = "../bytehost-chrome/crates/bytehost-panel" }

[patch."https://github.com/byteboyai/byteui"]
byteui = { path = "../byteui-shell" }
