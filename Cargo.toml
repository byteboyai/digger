[workspace]
resolver = "3"
members = ["crates/*"]
# spike/* 是一次性技术验证(ADR 验证项),各自带 [workspace]/[package] 且随时可删,
# 不进正式 workspace 的锁文件。嵌套的 spike/parser-agreement/rust 同样排除。
exclude = [
    "spike/block-identity",
    "spike/editor-host",
    "spike/md-engine",
    "spike/md-mirror",
    "spike/parser-agreement",
    "spike/text-merge",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
directories = "6"
# Markdown 块解析与块 ID 对齐(digger-editor)。
pulldown-cmark = { version = "0.13", default-features = false }
similar = "2"

# 共享桌面宿主契约:窗口壳、面板、Surface、布局、焦点(bytehost-desktop)。
bytehost-core = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }
# 共享窗口骨架(S1)。
bytehost-chrome = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }
bytehost-desktop = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }
# 应用 webview 的纯安全策略(origin/nonce/存储标识/数据存储清除排队);桌面宿主唯一真相。
bytehost-webview = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }

# 应用宿主平台:注册表/生命周期、与传输无关的客户端 API、与界面框架无关的面板状态机。
bytehost-apps = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }
bytehost-client = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }
bytehost-panel = { git = "https://github.com/byteboyai/bytehost", tag = "v0.4.16" }

# 组件库(Dozer 与 Digger 共用);iced 版本必须与 byteui 一致,一起升。
byteui = { git = "https://github.com/byteboyai/byteui", tag = "v0.5.0" }

# Dozer 与 Digger 共用的 Usage 面板库 + 领域类型/服务接缝(Task 19/20)。
# 领域 `dozer-model`(纯 serde)与 `dozer-services`(trait 接缝)供业务层 `digger-store`
# 实现 `UsageService`;`dozer-panel-usage` 含公共 UI 与 bytehost Surface,只许宿主适配层
# (`digger-desktop`)依赖。dozer 现有的 `v0.5.x` tag 是 App 发布 tag;库 crate 快照用
# `libs-2026-10-28f` tag(ADR:升级 bytehost/byteui 时 dozer 与 digger 同日一起升)。
dozer-model = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozer-services = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozer-panel-usage = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源 Todo 面板库(S3b-1):待办数据/视图/web 资源;与其它 dozer-panel-* 同 tag。
dozer-panel-todo = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源会话面板库(S7b):列表、历史导入与审阅状态。
dozer-panel-conversations = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源浏览器面板库:页签 / 地址栏 / 收藏夹状态机;网页由 bytehost web_child 的不可信子视图承载。
dozer-panel-browser = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozer-panel-group-chat = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源 Project 面板库(S5a):状态 / 更新 / 视图;依赖闭包不含 dozer-app/client/core。
dozer-panel-project = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源 Files 面板库(S5b-1):文件树状态 / 更新 / 视图 / 菜单;依赖闭包同样不含 dozer-app/client/core。
dozer-panel-files = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 面板库依赖的宿主件(激活上下文 / 请求身份);只许宿主适配层直接依赖。
# 同源预览面板库(S5b-2 P3):清单 / 协议应答 / 注入脚本 / IPC 分类 + 面板状态;不含 wry。
dozer-panel-preview = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 预览库背后的路由/画像/存储纯逻辑(`dozer-panel-preview` 的公开面已重导出大部分)。
dozer-preview-core = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozer-panel-host = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源终端输入 / 渲染库(S6d-1):本地开发由 .cargo/config.toml patch 到叠分支。
dozer-panel-term = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 同源 Agent 面板库(S6d-2):会话/页签状态、消息与更新、恢复路径与终端滚动/选区消息。
dozer-panel-agent = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# 面板的 git 快照(分支/脏标/remote)与「修复项目」的 git init 共用同一个 tag,图里只有一份。
bytegit = { git = "https://github.com/byteboyai/bytegit", tag = "v0.8.1", features = ["watch"] }
# Project 注册表与 Project 级共享记忆的存储和进程内服务(Dozer 与 Digger 共用同一份代码,各开各的数据库文件)。
dozer-store-project = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# S6a:守护进程 / hook / 客户端 / 核心路径库(本地 patch 到 dozer-mcp-product;tag 占位)。
dozer-core = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozerd = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozer-hook = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
dozer-client = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# S6e:Agent 的 MCP 服务库(按产品裁剪工具集;Digger 只开记忆三件)。
dozer-mcp = { git = "https://github.com/byteboyai/dozer", tag = "libs-2026-10-28f" }
# rusqlite 版本必须与 Dozer 一致(0.32.1),否则 Cargo.lock 出现两份。
rusqlite = { version = "0.32", features = ["bundled"] }

iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu"] }
# iced 的 core 类型(如 `text::Shaping`);iced 0.14 未公开重导出,组合根按需直接依赖同一版本。
iced_core = { version = "0.14", default-features = false }
wry = "0.55.1"
# 取 macOS 主版本号判数据存储清除是否受支持(纯策略 crate 不碰 objc2,宿主层来问)。
objc2-foundation = "0.3"


# 构建脚本(crates/desktop/build.rs)依赖 dozer-panel-usage,会把 iced_renderer 也编进 host 侧单元;
# 在 ~/.cargo/config 固定了 `build.target` 的机器上,host 单元不与目标单元合并 feature,release 下
# iced_renderer 会因"没有渲染器 feature"而 compile_error!。host 侧只是取静态资源路径、不渲染,
# 让 build-override 保留 debug-assertions 就能越过这条检查(不影响最终产物)。
[profile.release.build-override]
debug-assertions = true
