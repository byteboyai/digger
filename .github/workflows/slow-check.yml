name: Slow verification

# 完整属性集与 Release 基准。PR 门禁只跑快速代表集;这里保留全部种子与性能原始样本,
# 结果作为 artifact 上传,便于失败复现。图形 / 进程查询相关自检仍需要本地 macOS 环境。

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  slow:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout digger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-slow-${{ hashFiles('**/Cargo.lock') }}

      - name: 完整属性集(Release)
        run: |
          mkdir -p artifacts
          cargo test --locked --release -p digger-editor --lib 2>&1 | tee artifacts/editor-lib.log
          cargo test --locked --release -p digger-editor --test properties -- --nocapture 2>&1 | tee artifacts/properties.log

      - name: 准备 Node 同步基线
        working-directory: crates/desktop/web
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: 写字台进程故障与恢复(Release)
        run: |
          cargo test --locked --release -p digger-store writing:: -- --test-threads=1 2>&1 | tee artifacts/writing-faults.log

      - name: 写字台存储规模样本(Release)
        run: |
          cargo run --locked --release -q -p digger-store --example writing_bench 2>&1 | tee artifacts/writing-store.jsonl

      - name: 写字台后台队列样本(Debug，单独标记)
        run: |
          cargo test --locked -p digger-desktop --lib markdown::tests::writing_queue_performance_samples -- --exact --ignored --nocapture 2>&1 | tee artifacts/writing-queue.log

      - name: Release 基准(100 / 1000 / 5000 块)
        run: |
          mkdir -p artifacts
          bash scripts/bench-editor-sync.sh "$PWD/artifacts/editor" 2>&1 | tee artifacts/sync_bench.log

      - name: SQLite 规模验证(1k / 10k / 100k)
        run: |
          cargo run --locked --release -q -p digger-store --example usage_bench 2>&1 | tee artifacts/usage_bench.jsonl

      - name: 上传样本与失败日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-verification-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
