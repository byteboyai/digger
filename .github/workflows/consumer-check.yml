name: Consumer check

# Digger 的 PR 门禁:编译 + 依赖门禁 + 核心 Rust 行为测试 + 无窗口 web 同步测试与产物一致性。
# 完整属性集 / Release 基准 / 图形自检在 slow-check.yml(定时或手动)。
# 已接入 byteboyai/digger；发行构建使用已发布共享库，不依赖个人 path patch。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consumer-check:
    runs-on: macos-latest
    steps:
      - name: Checkout digger
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/desktop/web/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check --locked --workspace --all-targets
        run: cargo check --locked --workspace --all-targets

      - name: 核心 Rust 行为测试
        run: |
          cargo test --locked -p digger-editor --lib -- --skip typing_in_a_book_parses_a_few_blocks_not_the_book
          cargo test --locked -p digger-editor --test properties results_are_deterministic
          cargo test --locked -p digger-editor --test properties split_and_merge_follow_the_configured_policy
          cargo test --locked -p digger-store -p digger-app-host -p digger-paths

      - name: 业务层宿主依赖门禁
        run: bash scripts/check-host-deps.sh --self-test

      - name: 实机自检入口故障测试
        run: python3 scripts/tests/test_editor_selftest.py

      - name: 共享库钉版守卫
        run: bash scripts/check-shared-deps.sh --offline

      - name: Web 依赖安装
        working-directory: crates/desktop/web
        run: npm ci --no-audit --no-fund

      - name: TypeScript 检查
        working-directory: crates/desktop/web
        run: npm run check

      - name: 无窗口同步状态机测试
        working-directory: crates/desktop/web
        run: npm test

      - name: Parser fixtures 与生产 Rust parser 一致
        working-directory: crates/desktop/web
        run: npm run fixtures:check

      - name: 嵌入页面与源码一致
        run: bash scripts/build-editor-web.sh --check
