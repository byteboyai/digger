name: Consumer check

# Digger 的 PR 门禁:编译 + 依赖门禁 + 核心 Rust 行为测试 + 无窗口 web 同步测试与产物一致性。
# 完整属性集 / Release 基准 / 图形自检在 slow-check.yml(定时或手动)。
# 仓库没有远端时这份 workflow 只在本地分支提交,配置 remote 后生效。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consumer-check:
    runs-on: macos-latest
    steps:
      - name: Checkout digger
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/desktop/web/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check --locked --workspace --all-targets
        run: cargo check --locked --workspace --all-targets

      - name: 核心 Rust 行为测试
        run: cargo test --locked -p digger-editor -p digger-store -p digger-app-host -p digger-paths

      - name: 业务层宿主依赖门禁
        run: bash scripts/check-host-deps.sh

      - name: 共享库钉版守卫
        run: bash scripts/check-shared-deps.sh --offline

      - name: Web 依赖安装
        working-directory: crates/desktop/web
        run: npm ci --no-audit --no-fund

      - name: TypeScript 检查
        working-directory: crates/desktop/web
        run: npm run check

      - name: 无窗口同步状态机测试
        working-directory: crates/desktop/web
        run: npm test

      - name: Parser fixtures 与生产 Rust parser 一致
        working-directory: crates/desktop/web
        run: npm run fixtures:check

      - name: 嵌入页面与源码一致
        run: bash scripts/build-editor-web.sh --check
